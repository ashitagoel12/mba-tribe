<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>MBA Scraper — Debug Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 15px; color: #e6edf3; letter-spacing: .5px; }
    header .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
    }
    .run-ts { margin-left: auto; font-size: 11px; color: #6e7681; }

    /* ── Stat bar ── */
    .stats {
      display: flex;
      gap: 0;
      border-bottom: 1px solid #30363d;
      background: #161b22;
    }
    .stat {
      flex: 1;
      padding: 14px 20px;
      border-right: 1px solid #30363d;
      cursor: pointer;
      transition: background .15s;
      position: relative;
    }
    .stat:last-child { border-right: none; }
    .stat:hover { background: #1c2128; }
    .stat.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat.active[data-filter="all"]::after    { background: #58a6ff; }
    .stat.active[data-filter="success"]::after { background: #3fb950; }
    .stat.active[data-filter="failed"]::after  { background: #f85149; }
    .stat.active[data-filter="manual_review_needed"]::after { background: #d29922; }

    .stat-num {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .8px; }
    .stat[data-filter="all"] .stat-num    { color: #58a6ff; }
    .stat[data-filter="success"] .stat-num { color: #3fb950; }
    .stat[data-filter="failed"] .stat-num  { color: #f85149; }
    .stat[data-filter="manual_review_needed"] .stat-num { color: #d29922; }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 106px);
    }

    /* ── School list ── */
    .school-list {
      border-right: 1px solid #30363d;
      overflow-y: auto;
      background: #0d1117;
    }
    .school-list::-webkit-scrollbar { width: 4px; }
    .school-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    .search-wrap {
      position: sticky;
      top: 0;
      background: #0d1117;
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      z-index: 10;
    }
    .search-wrap input {
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-family: inherit;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
    }
    .search-wrap input:focus { border-color: #58a6ff; }
    .search-wrap input::placeholder { color: #6e7681; }

    .school-item {
      padding: 10px 14px;
      border-bottom: 1px solid #161b22;
      cursor: pointer;
      transition: background .1s;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .school-item:hover { background: #161b22; }
    .school-item.selected { background: #1c2128; border-left: 3px solid #58a6ff; }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .dot-success { background: #3fb950; }
    .dot-failed  { background: #f85149; }
    .dot-manual  { background: #d29922; }

    .school-item-name { font-size: 12px; color: #e6edf3; line-height: 1.4; }
    .school-item-sub  { font-size: 10px; color: #6e7681; margin-top: 2px; }

    /* ── Detail pane ── */
    .detail {
      overflow-y: auto;
      padding: 24px;
      background: #0d1117;
    }
    .detail::-webkit-scrollbar { width: 4px; }
    .detail::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: #6e7681;
      font-size: 13px;
    }
    .detail-empty .icon { font-size: 32px; opacity: .4; }

    .detail-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #21262d;
    }
    .detail-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .detail-name { font-size: 18px; color: #e6edf3; font-weight: 700; line-height: 1.3; }
    .detail-id   { font-size: 11px; color: #6e7681; margin-top: 4px; font-family: monospace; }

    .status-chip {
      margin-left: auto;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .chip-success { background: #0d4429; color: #3fb950; border: 1px solid #1f6233; }
    .chip-failed  { background: #3d0c0c; color: #f85149; border: 1px solid #6e1313; }
    .chip-manual  { background: #3d2a00; color: #d29922; border: 1px solid #6e4d00; }

    /* ── Sections ── */
    .section { margin-bottom: 22px; }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6e7681;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #21262d;
    }

    /* Error box */
    .error-box {
      background: #160b0b;
      border: 1px solid #6e1313;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 12px;
      color: #f85149;
      line-height: 1.5;
      word-break: break-all;
    }

    /* URL list */
    .url-list { display: flex; flex-direction: column; gap: 6px; }
    .url-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
    }
    .url-item a { color: #58a6ff; text-decoration: none; word-break: break-all; }
    .url-item a:hover { text-decoration: underline; }
    .url-icon { font-size: 13px; flex-shrink: 0; }

    /* Data grid */
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .data-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 10px 14px;
    }
    .data-card-label { font-size: 10px; color: #6e7681; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
    .data-card-val   { font-size: 15px; color: #e6edf3; font-weight: 700; }
    .data-card-val.null-val { color: #6e7681; font-size: 12px; font-weight: 400; font-style: italic; }

    /* Raw JSON */
    .raw-toggle {
      font-size: 11px;
      color: #58a6ff;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-bottom: 8px;
    }
    .raw-toggle:hover { text-decoration: underline; }
    pre.raw-json {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 14px;
      font-size: 11px;
      line-height: 1.6;
      overflow-x: auto;
      color: #c9d1d9;
      display: none;
    }
    pre.raw-json.visible { display: block; }
  </style>
</head>

statDefs.forEach(def => {
  const div = document.createElement('div');
  div.className = 'stat' + (def.filter === activeFilter ? ' active' : '');
  div.dataset.filter = def.filter;
  div.innerHTML = `<div class="stat-num">${def.num}</div><div class="stat-label">${def.label}</div>`;
  div.addEventListener('click', () => {
    activeFilter = def.filter;
    document.querySelectorAll('.stat').forEach(el => el.classList.remove('active'));
    div.classList.add('active');
    renderList();
  });
  statsEl.appendChild(div);
});

// ── List rendering ──
function dotClass(s) {
  if (s === 'success') return 'dot-success';
  if (s === 'failed')  return 'dot-failed';
  return 'dot-manual';
}
function statusLabel(s) {
  if (s === 'success') return 'OK';
  if (s === 'failed')  return 'FAILED';
  return 'BLOCKED';
}
function chipClass(s) {
  if (s === 'success') return 'chip-success';
  if (s === 'failed')  return 'chip-failed';
  return 'chip-manual';
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  const visible = ALL.filter(s => {
    const matchFilter = activeFilter === 'all' || s.status === activeFilter;
    const matchSearch = !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  visible.forEach(school => {
    const div = document.createElement('div');
    div.className = 'school-item' + (school.id === selectedId ? ' selected' : '');
    div.innerHTML = `
      <div class="dot ${dotClass(school.status)}"></div>
      <div>
        <div class="school-item-name">${school.name}</div>
        <div class="school-item-sub">${school.id} &nbsp;·&nbsp; ${statusLabel(school.status)}</div>
      </div>`;
    div.addEventListener('click', () => {
      selectedId = school.id;
      renderList();
      renderDetail(school);
    });
    listEl.appendChild(div);
  });
}

// ── Detail rendering ──
function renderDetail(school) {
  const det = document.getElementById('detail');

  const dataFields = [];
  const d = school.data || {};
  if (d.academics) {
    Object.entries(d.academics).forEach(([k,v]) => dataFields.push([k, v]));
  }
  if (d.class_profile) {
    Object.entries(d.class_profile).forEach(([k,v]) => dataFields.push([k, v]));
  }
  if (d.employment) {
    Object.entries(d.employment).forEach(([k,v]) => dataFields.push([k, v]));
  }
  if (d.location) {
    Object.entries(d.location).forEach(([k,v]) => dataFields.push([k, v]));
  }

  const dataCardsHtml = dataFields.length
    ? `<div class="data-grid">${dataFields.map(([k,v]) => `
        <div class="data-card">
          <div class="data-card-label">${k.replace(/_/g,' ')}</div>
          <div class="data-card-val ${v === null ? 'null-val' : ''}">${v === null ? 'null' : v}</div>
        </div>`).join('')}
      </div>`
    : `<div style="color:#6e7681;font-size:12px;font-style:italic;">No fields extracted — page loaded but regex matched nothing.</div>`;

  const errorHtml = school.error
    ? `<div class="section">
        <div class="section-title">Error</div>
        <div class="error-box">${school.error}</div>
       </div>`
    : '';

  const urlsHtml = (school.urls_attempted || []).map(u =>
    `<div class="url-item">
      <span class="url-icon">&#128279;</span>
      <a href="${u}" target="_blank">${u}</a>
     </div>`
  ).join('');

  det.innerHTML = `
    <div class="detail-header">
      <div class="detail-dot ${dotClass(school.status)}"></div>
      <div>
        <div class="detail-name">${school.name}</div>
        <div class="detail-id">${school.id}</div>
      </div>
      <span class="status-chip ${chipClass(school.status)}">${statusLabel(school.status)}</span>
    </div>

    ${errorHtml}

    <div class="section">
      <div class="section-title">URLs Attempted (${(school.urls_attempted||[]).length})</div>
      <div class="url-list">${urlsHtml || '<div style="color:#6e7681;font-size:12px;">none</div>'}</div>
    </div>

    <div class="section">
      <div class="section-title">Extracted Data</div>
      ${dataCardsHtml}
    </div>

    <div class="section">
      <button class="raw-toggle" onclick="this.nextElementSibling.classList.toggle('visible');this.textContent=this.nextElementSibling.classList.contains('visible')?'Hide raw JSON':'Show raw JSON'">Show raw JSON</button>
      <pre class="raw-json">${JSON.stringify(school, null, 2)}</pre>
    </div>`;
}

// ── Search ──
document.getElementById('search').addEventListener('input', renderList);

// Init
renderList();
</script>
</body>
</html>
