name: link-check

# Visits every URL in the school data (plain HTTP, no AI, free), repairs broken
# ones and writes data/LINK-REPORT.md. Runs on pull requests that change the data,
# monthly, or by hand.

on:
  pull_request:
    paths: ['data/mba_schools_data.json']
  workflow_dispatch:
  schedule:
    - cron: '41 13 15 * *'   # monthly

permissions:
  contents: write
  pull-requests: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/checkLinks.test.mjs
      - run: node scripts/checkLinks.mjs
      - name: Commit repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "link-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          if [ -n "${{ github.head_ref }}" ]; then
            git commit -m "Link check: repair broken links"
            git push origin "HEAD:${{ github.head_ref }}"
            gh pr comment "${{ github.event.pull_request.number }}" --body-file data/LINK-REPORT.md || true
          else
            BRANCH="link-check-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
            git checkout -b "$BRANCH"
            git commit -m "Link check: repair broken links"
            git push origin "$BRANCH"
            gh pr create --title "Link check $(date -u +%Y-%m-%d)" --body-file data/LINK-REPORT.md --base main --head "$BRANCH" || true
          fi
