name: refresh-school-data

# Finds current figures on each school's own website, verifies every value in code,
# and opens a pull request with the verified changes and a report. Nothing goes live
# until the pull request is merged.

on:
  workflow_dispatch:
    inputs:
      schools:
        description: 'remaining (not yet verified), pilot, all, or comma-separated school ids'
        required: true
        default: pilot
      model:
        description: 'claude-haiku-5-5 (cheaper) or claude-sonnet-5-5 (more thorough)'
        required: true
        default: claude-haiku-5-5
  schedule:
    - cron: '23 14 1 1,4,7,10 *'   # quarterly, all schools

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm install --no-save pdfjs-dist@4

      # Run the offline tests first, so a broken script fails before any API spend.
      - name: Tests (before spending anything)
        run: node scripts/refresh/refresh.test.mjs

      - name: Find and verify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFRESH_MODEL: ${{ github.event.inputs.model || 'claude-haiku-5-5' }}
        run: node scripts/refresh/refreshData.mjs --schools "${{ github.event.inputs.schools || 'all' }}"

      # Results are saved after every school; keep them even if a later step fails.
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-results
          path: data/refresh/
          if-no-files-found: ignore

      - name: Apply verified values
        run: |
          DIR=$(ls -d data/refresh/*/ | sort | tail -1)
          node scripts/refresh/applyRefresh.mjs "${DIR}changes.json"

      # Checks on the updated data are reported in the PR, not allowed to block it.
      - name: Checks on updated data
        continue-on-error: true
        run: |
          DIR=$(ls -d data/refresh/*/ | sort | tail -1)
          { echo; echo '## Checks on the updated data'; echo '```';
            node scripts/personaCheck.mjs 2>&1 | tail -15;
            python3 scripts/auditData.py 2>&1 | head -12;
            echo '```'; } >> "${DIR}report.md"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="data-refresh-$DATE-${{ github.run_number }}-${{ github.run_attempt }}"
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "Data refresh $DATE (${{ github.event.inputs.schools || 'all' }})"
          git push origin "$BRANCH"
          REPORT=$(ls -d data/refresh/*/ | sort | tail -1)report.md
          # PR bodies are capped at 65k characters; link the full report if it is longer.
          if [ $(wc -c < "$REPORT") -gt 60000 ]; then
            head -c 55000 "$REPORT" > /tmp/body.md
            printf '\n\n…report truncated. Full report: data/refresh/%s/report.md on this branch.\n' "$DATE" >> /tmp/body.md
          else cp "$REPORT" /tmp/body.md; fi
          gh pr create --title "Data refresh $DATE" --body-file /tmp/body.md --base main --head "$BRANCH" \
            || echo "::warning::Could not open a PR automatically. Open one from branch $BRANCH."
